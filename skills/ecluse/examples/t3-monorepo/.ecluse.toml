mode = "hybrid"
max_slots = 4
base_port = 3000
stride = 100
prefix = "ecluse"

# Four services, each needs its own host port for hot-reload and direct access.
# slot 1 → 3100–3103, slot 2 → 3200–3203, etc.
[ports]
api      = 0   # → ECLUSE_API_PORT     tRPC / REST API (Next.js API routes or standalone)
web      = 1   # → ECLUSE_WEB_PORT     Next.js frontend
worker   = 2   # → ECLUSE_WORKER_PORT  BullMQ admin board (bull-board)
email    = 3   # → ECLUSE_EMAIL_PORT   React Email preview server

[hooks]
on_up  = "npx prisma migrate deploy"
on_down = "npx prisma migrate reset --force"
