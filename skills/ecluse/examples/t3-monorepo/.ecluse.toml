mode = "hybrid"
max_slots = 4
prefix = "ecluse"

# tRPC / REST API: slot 1 → ECLUSE_API_PORT=3001 + PORT alias, slot 2 → 3002
[[services]]
name = "api"
base_port = 3000

# Next.js frontend: slot 1 → ECLUSE_WEB_PORT=3101, slot 2 → 3102
[[services]]
name = "web"
base_port = 3100

# BullMQ admin board: slot 1 → ECLUSE_WORKER_PORT=3201, slot 2 → 3202
[[services]]
name = "worker"
base_port = 3200

# React Email preview: slot 1 → ECLUSE_EMAIL_PORT=3301, slot 2 → 3302
[[services]]
name = "email"
base_port = 3300

# Data services — rewritten in compose overlay
[[services]]
name = "postgres"
run = "docker"
base_port = 5432

[[services]]
name = "redis"
run = "docker"
base_port = 6379

[hooks]
post_up  = "npx prisma migrate deploy"
pre_down = "npx prisma migrate reset --force"
