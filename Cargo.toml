[package]
name = "ecluse"
version = "0.1.0"
edition = "2021"
description = "Per-worktree isolation. Pick what you need isolated."
license = "Apache-2.0"

[[bin]]
name = "ecluse"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
serde_yaml = "0.9"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
fs2 = "0.4"
tabled = "0.15"
chrono = { version = "0.4", features = ["serde"] }
regex-lite = "0.1"

[profile.release]
strip = true
opt-level = "z"
lto = true
