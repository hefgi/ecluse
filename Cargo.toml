[package]
name = "ecluse"
version = "0.2.13"
edition = "2021"
description = "Ephemeral local environments for coding agents — any stack."
license = "Apache-2.0"
homepage = "https://github.com/hefgi/ecluse"
repository = "https://github.com/hefgi/ecluse"
keywords = ["worktree", "isolation", "docker", "cli", "devtools"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "ecluse"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
serde_yaml = "0.9"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
fs2 = "0.4"
tabled = "0.15"
chrono = { version = "0.4", features = ["serde"] }
regex-lite = "0.1"
indexmap = { version = "2", features = ["serde"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
opt-level = "z"
lto = true
