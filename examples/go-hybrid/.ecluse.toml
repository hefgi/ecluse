mode = "hybrid"
max_slots = 6
prefix = "ecluse"

# Go HTTP server: slot 1 → ECLUSE_API_PORT=8081 + PORT alias, slot 2 → 8082
[[services]]
name = "api"
base_port = 8080

# Postgres data service — rewritten in compose overlay
[[services]]
name = "postgres"
run = "docker"
base_port = 5432

[hooks]
post_up = "migrate -path ./migrations -database \"postgres://localhost:$ECLUSE_POSTGRES_PORT/myapp\" up"
