mode = "hybrid"
max_slots = 6
prefix = "ecluse"

# Node/Express API: slot 1 → ECLUSE_API_PORT=3001 + PORT alias, slot 2 → 3002
[[services]]
name = "api"
base_port = 3000

# MongoDB data service — rewritten in compose overlay
[[services]]
name = "mongo"
run = "docker"
base_port = 27017

[hooks]
on_up = "npm run db:seed"
