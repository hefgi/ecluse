mode = "hybrid"
max_slots = 6
base_port = 3000
stride = 100
prefix = "ecluse"

# Rails API on index 0 → ECLUSE_API_PORT + PORT alias (e.g. 3100 for slot 1)
# Angular dev server on index 1 → ECLUSE_FRONTEND_PORT (e.g. 3101 for slot 1)
[ports]
api = 0
frontend = 1

[hooks]
on_up = "bin/rails db:prepare"
on_down = "bin/rails db:drop DISABLE_DATABASE_ENVIRONMENT_CHECK=1"
