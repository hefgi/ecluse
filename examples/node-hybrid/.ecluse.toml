mode = "hybrid"
max_slots = 6
prefix = "ecluse"

# Express API: slot 1 → ECLUSE_API_PORT=3001 + PORT alias, slot 2 → 3002
[[services]]
name = "api"
base_port = 3000

# React dev server: slot 1 → ECLUSE_FRONTEND_PORT=5174, slot 2 → 5175
[[services]]
name = "frontend"
base_port = 5173

# Data services — rewritten in compose overlay
[[services]]
name = "postgres"
run = "docker"
base_port = 5432

[[services]]
name = "redis"
run = "docker"
base_port = 6379

[hooks]
on_up = "npm run db:migrate"
