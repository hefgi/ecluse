mode = "hybrid"
max_slots = 6
prefix = "ecluse"

# Rails Puma server: slot 1 → ECLUSE_WEB_PORT=3001 + PORT alias, slot 2 → 3002
[[services]]
name = "web"
base_port = 3000

# Sidekiq Web UI: slot 1 → ECLUSE_SIDEKIQ_PORT=4568, slot 2 → 4569
[[services]]
name = "sidekiq"
base_port = 4567

# Blazer / ActiveAdmin: slot 1 → ECLUSE_ADMIN_PORT=4001, slot 2 → 4002
[[services]]
name = "admin"
base_port = 4000

# Data services — rewritten in compose overlay
[[services]]
name = "postgres"
run = "docker"
base_port = 5432

[[services]]
name = "redis"
run = "docker"
base_port = 6379

[hooks]
post_up  = "bin/rails db:prepare"
pre_down = "bin/rails db:drop DISABLE_DATABASE_ENVIRONMENT_CHECK=1"
