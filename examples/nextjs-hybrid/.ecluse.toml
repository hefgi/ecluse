mode = "hybrid"
max_slots = 6
prefix = "ecluse"

# Next.js dev server: slot 1 → ECLUSE_APP_PORT=3001 + PORT alias, slot 2 → 3002
[[services]]
name = "app"
base_port = 3000

# Postgres data service — rewritten in compose overlay
[[services]]
name = "postgres"
run = "docker"
base_port = 5432

[hooks]
on_up = "npx prisma migrate deploy"
