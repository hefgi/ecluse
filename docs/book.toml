[book]
title = "ecluse"
description = "Per-worktree isolation for parallel coding agents"
authors = ["Hefgi"]
language = "en"
src = "src"

[output.html]
site-url = "/"
default-theme = "navy"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/hefgi/ecluse"
no-section-label = true
edit-url-template = "https://github.com/hefgi/ecluse/edit/main/docs/src/{path}"
additional-css = ["theme/custom.css"]

[output.html.fold]
enable = true
level = 1
